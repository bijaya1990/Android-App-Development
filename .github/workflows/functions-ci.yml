name: Functions CI

on:
  push:
    branches: [main]
    paths: ["finchowk/functions/**", ".github/workflows/functions-ci.yml"]
  pull_request:
    paths: ["finchowk/functions/**", ".github/workflows/functions-ci.yml"]

defaults:
  run:
    working-directory: finchowk/functions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: finchowk/functions/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
