name: App CI

on:
  push:
    branches: [main]
    paths: ["finchowk/app/**", ".github/workflows/app-ci.yml"]
  pull_request:
    paths: ["finchowk/app/**", ".github/workflows/app-ci.yml"]

defaults:
  run:
    working-directory: finchowk/app

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.5
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
