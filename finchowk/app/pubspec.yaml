name: finchowk
description: "FinChowk — financial offer discovery & referral platform. NOT a lender."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  # State management + navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.1

  # Data model codegen (immutable models, JSON (de)serialization)
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Backend
  cloud_firestore: ^5.4.4
  firebase_core: ^3.6.0
  firebase_app_check: ^0.3.1+7
  firebase_crashlytics: ^4.1.3

  # Local cache (offers/config cache-first load, consent-gated analytics queue)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Partner links + offer imagery + legal markdown rendering
  url_launcher: ^6.3.1
  cached_network_image: ^3.4.1
  flutter_markdown: ^0.7.4+3

  # Localisation (English + Hindi via ARB files)
  intl: ^0.19.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/config/offers_fallback.json

  # Poppins (headings 600/700), Inter (body, variable font serving 400/500),
  # Noto Sans Devanagari (Hindi fallback) — no Figma file was available
  # (see DESIGN_NOTES.md), so these are the Google Fonts OFL originals
  # bundled locally rather than eyeballed or fetched at runtime.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 400
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 500
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
          weight: 400
